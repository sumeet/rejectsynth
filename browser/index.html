<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>rejectsynth</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="./style.css">
  </head>
  <body>
    <main>
      <div class="playground">
        <div id="editor" aria-label="Editable rejectsynth song"></div>
        <p id="loading">Loading editor…</p>
        <div class="vim-controls">
          <div id="vim-status" aria-live="polite" hidden></div>
          <button id="vim-toggle" type="button" aria-label="Enable Vim keybindings" title="Enable Vim keybindings" aria-pressed="false" disabled>
            <img src="./vim.svg" alt="" width="25" height="25">
          </button>
        </div>
      </div>
      <span id="status" role="status" class="visually-hidden">Loading editor</span>
      <p id="error" role="status" aria-live="polite"></p>
      <noscript>This music editor needs JavaScript.</noscript>
    </main>
    <script type="module" src="./boot.js"></script>
  </body>
</html>
